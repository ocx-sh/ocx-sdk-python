# Template-owned (ocx-sh/conventions). Change the template, then run task copier:update.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged)
        entry: ocx exec -g lint -- gitleaks git --staged --redact --no-banner
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      - id: conventional-commit
        name: conventional commit subject
        entry: |-
          sh -c 'msg=$(head -n1 "$1"); case "$msg" in Merge\ *|Revert\ \"*) exit 0;; esac; printf "%s\n" "$msg" | grep -Eq "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+" && exit 0; printf "commit subject must be \047<type>[(scope)][!]: <subject>\047 with type one of: feat fix docs style refactor perf test build ci chore revert\n" >&2; exit 1' --
        language: system
        stages: [commit-msg]
      - id: repo-pre-commit
        name: repo pre-commit hooks (optional task hooks:pre-commit)
        entry: |-
          sh -c 'if ocx exec -- task --list-all 2>/dev/null | grep -Fq "* hooks:pre-commit:"; then ocx exec -- task hooks:pre-commit; fi'
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

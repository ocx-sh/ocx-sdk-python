version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-dependencies:
        patterns: ["*"]
  # Bump @ocx-sh/theme and the deploy action's SHA in deploy.yml together:
  # the action aborts on a Pagefind version mismatch.
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    groups:
      ocx-theme:
        patterns: ["@ocx-sh/theme"]

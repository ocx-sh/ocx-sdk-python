name: Acceptance

# The acceptance tier stands up two registry containers and pushes real
# packages through them, so it is deliberately not on the per-PR path: it runs
# after merge, nightly, and on demand.
on:
  push:
    branches: [main]
  schedule:
    # Nightly at 03:00 UTC — the canary job below only runs on this trigger.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e  # v1
      # docker and docker compose are preinstalled on the ubuntu runners, and
      # the compose stack is brought up by the pytest session fixture — so the
      # tier stays one command here and one command locally.
      - name: Acceptance tests
        run: ocx run -- task test:acceptance

  # Same suite against whatever ocx released most recently, so a breaking
  # change upstream surfaces here instead of in a user's pipeline. Nightly
  # only, and allowed to fail: it reports on ocx, not on this PR.
  canary:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      OCX_TEST_VERSIONS: latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e  # v1
      - name: Acceptance tests against the latest ocx
        run: ocx run -- task test:acceptance

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}  # least privilege; jobs elevate individually

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required for softprops/action-gh-release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Verify tag matches pyproject.toml version
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PYPROJ=$(grep -E '^version = ' pyproject.toml | head -1 | cut -d'"' -f2)
          if [[ "$TAG" != "$PYPROJ" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $PYPROJ"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches pyproject version $PYPROJ."

      - uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e  # v1

      - name: Verify before release
        run: ocx run -- task verify

      - name: Build wheel + sdist
        run: ocx run -- task build

      - name: Upload artifacts to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8  # v2.3.2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true

      - name: Share dist with publish job (doubles as dry-run inspection)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 1

  publish-pypi:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ocx-sdk
    permissions:
      id-token: write  # PyPI Trusted Publishing (OIDC) — no tokens stored
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

name: CI

# Every job provisions its toolchain with `ocx-sh/setup-ocx`, which ACTIVATES
# the project when ocx.toml is present — the tools ocx.lock pins are on PATH
# for every step that follows. So steps invoke `task <name>` directly: an
# `ocx run -- task <name>` wrapper would be redundant indirection, not extra
# safety. Locally, `.envrc` (direnv) activates the same project the same way,
# so CI and a developer's shell run byte-identical commands.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e  # v1
      - name: Verify
        run: task verify
      - name: Coverage XML
        if: ${{ !cancelled() }}
        run: task cov:xml
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  unit-matrix:
    needs: verify
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e  # v1
      - name: Test
        run: task test -- --junitxml=test-results.xml
      # Platform-specific branches (POSIX process groups, the Windows kill
      # path) make fail_under=100 unattainable off Linux. The Linux legs
      # enforce the gate; mac and windows legs prove functional correctness.
      - name: Coverage report
        if: runner.os == 'Linux'
        run: task cov:report
      # Designated leg publishes the PR test-report annotation — one leg is
      # enough, and fork PRs get a read-only token so this stays same-repo only.
      - name: Publish test report
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && matrix.python == '3.13' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16  # v6.4.2
        with:
          report_paths: test-results.xml

  contract:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e  # v1
      - name: Contract tests
        run: task test:contract

  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e  # v1
      - name: Lint GitHub Actions workflows
        run: task lint:actions
      - name: Check for broken links
        run: task lint:links
      - name: Scan for committed secrets
        run: task secrets

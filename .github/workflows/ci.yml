name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e  # v1
      - name: Verify
        run: ocx run -- task verify
      - name: Coverage XML
        if: ${{ !cancelled() }}
        run: ocx run -- task cov:xml
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe  # v5.5.4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  unit-matrix:
    needs: verify
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e  # v1
      - name: Test
        run: ocx run -- task test -- --junitxml=test-results.xml
      # Platform-specific branches (POSIX process groups, the Windows kill
      # path) make fail_under=100 unattainable off Linux. The Linux legs
      # enforce the gate; mac and windows legs prove functional correctness.
      - name: Coverage report
        if: runner.os == 'Linux'
        run: ocx run -- task cov:report
      # Designated leg publishes the PR test-report annotation — one leg is
      # enough, and fork PRs get a read-only token so this stays same-repo only.
      - name: Publish test report
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && matrix.python == '3.13' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16  # v6.4.2
        with:
          report_paths: test-results.xml

  contract:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e  # v1
      - name: Contract tests
        run: ocx run -- task test:contract

  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e  # v1
      - name: Lint GitHub Actions workflows
        run: ocx run -- task lint:actions
      - name: Check for broken links
        run: ocx run -- task lint:links
      - name: Scan for committed secrets
        run: ocx run -- task secrets

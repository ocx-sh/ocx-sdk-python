# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  default:
    desc: Fast feedback loop — lint + types + tests
    cmds:
      - task: verify

  verify:
    desc: Full quality gate (format check, lint, types, tests, coverage)
    cmds:
      - task: format:check
      - task: lint
      - task: types
      - task: test
      - task: cov:report

  format:
    desc: Apply formatting
    cmds:
      - uv run --extra dev ruff format src tests

  format:check:
    desc: Check formatting without applying
    cmds:
      - uv run --extra dev ruff format --check src tests

  lint:
    desc: Lint source
    cmds:
      - uv run --extra dev ruff check src tests

  types:
    desc: Type-check source
    cmds:
      - uv run --extra dev pyright

  test:
    desc: Run pytest under coverage
    cmds:
      - uv run --extra dev coverage run -m pytest {{.CLI_ARGS}}

  test:contract:
    desc: Run contract-tier tests against the pinned ocx binary
    cmds:
      - OCX_SDK_CONTRACT=1 uv run --extra dev pytest tests/contract {{.CLI_ARGS}}

  test:acceptance:
    desc: Run acceptance-tier tests against a compose stack
    cmds:
      - OCX_SDK_ACCEPTANCE=1 uv run --extra dev pytest tests/acceptance {{.CLI_ARGS}}

  cov:report:
    desc: Print coverage report (enforces fail_under from pyproject.toml)
    cmds:
      - uv run --extra dev coverage report

  cov:xml:
    desc: Emit coverage.xml for CI upload
    cmds:
      - uv run --extra dev coverage xml

  cov:html:
    desc: Generate HTML coverage report at htmlcov/ for local browsing
    cmds:
      - uv run --extra dev coverage html

  docs:serve:
    desc: Live-reload MkDocs server at http://127.0.0.1:8000
    cmds:
      - uv run --extra docs mkdocs serve -a 127.0.0.1:8000

  docs:build:
    desc: Build the static site into site/ (strict mode)
    cmds:
      - uv run --extra docs mkdocs build --strict
    sources:
      - 'docs/**/*'
      - 'src/ocx_sdk/**/*.py'
      - 'mkdocs.yml'
    generates:
      - 'site/**/*'

  docs:clean:
    desc: Remove the generated site/ directory
    cmds:
      - rm -rf site

  lint:actions:
    desc: Lint GitHub Actions workflows
    cmds:
      - actionlint

  lint:links:
    desc: Check for broken links (network; may be flaky offline)
    cmds:
      - lychee --cache --max-cache-age 1d .

  secrets:
    desc: Scan for committed secrets
    cmds:
      - gitleaks detect --source . --redact

  build:
    desc: Build wheel + sdist
    cmds:
      - uv build

  # Regenerate CHANGELOG.md from the full git history.
  changelog:
    desc: Update CHANGELOG.md from git history
    cmds:
      - git-cliff --output CHANGELOG.md

  # Show what would go into the next release's changelog section.
  changelog:preview:
    desc: Preview unreleased changes
    cmds:
      - git-cliff --unreleased

  # Full release preparation: compute next version, update pyproject + install
  # snippets + CHANGELOG, run verify. After this task succeeds, the human
  # reviews and commits.
  #
  # Version selection:
  #   task release:prepare                 # interactive menu: auto | patch | minor | major
  #   task release:prepare BUMP=minor      # skip the menu, force a bump level
  #   task release:prepare BUMP=auto VERSION=1.4.0   # pin an exact version (v prefix optional)
  #
  # BUMP is a required enum: with interactive mode on (.taskrc.yml) and a TTY it
  # renders a selection menu; on CI / no TTY it must be passed on the CLI.
  release:prepare:
    desc: 'Prepare a release (interactive: pick auto|patch|minor|major; or BUMP=<level> / VERSION=x.y.z)'
    requires:
      vars:
        - name: BUMP
          enum: [auto, patch, minor, major]
    vars:
      # git-cliff computes the next version from git history. `auto` lets it pick
      # the bump from conventional commits; otherwise BUMP forces the level.
      # VERSION pins an exact value and wins over BUMP.
      NEXT_VERSION:
        sh: |
          if [ -n "{{.VERSION}}" ]; then
            printf 'v%s' "{{.VERSION | default "" | trimPrefix "v"}}"
          elif [ "{{.BUMP}}" = "auto" ]; then
            git-cliff --bumped-version
          else
            git-cliff --bumped-version --bump "{{.BUMP}}"
          fi
    cmds:
      - echo "Next version:{{.NEXT_VERSION}}"
      - uv version "{{.NEXT_VERSION | trimPrefix "v"}}"
      - sed -i -E 's|ocx-sdk~=[0-9]+\.[0-9]+\.[0-9]+|ocx-sdk~={{.NEXT_VERSION | trimPrefix "v"}}|g' README.md docs/getting-started/install.md
      - git-cliff --tag "{{.NEXT_VERSION}}" -o CHANGELOG.md
      - task verify
      - |
        echo ""
        echo "Release prepared ({{.NEXT_VERSION}}). Review changes, then:"
        echo "  git add -A && git commit -m 'chore(release): {{.NEXT_VERSION}}'"
        echo "  git tag {{.NEXT_VERSION}}"
        echo "  git push --atomic origin main {{.NEXT_VERSION}}"

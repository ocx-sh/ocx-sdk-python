[project]
name = "ocx-sdk"
version = "0.1.0"
description = "Python SDK for OCX"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "The OCX Authors" }]
keywords = ["ocx", "oci", "registry", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ocx-sh/ocx-sdk-python"
Repository = "https://github.com/ocx-sh/ocx-sdk-python"
Issues = "https://github.com/ocx-sh/ocx-sdk-python/issues"

[project.optional-dependencies]
dev = [
    "coverage>=7.6",
    "pyright>=1.1",
    "pytest>=8",
    "ruff>=0.9",
]
docs = [
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=0.27,<0.30",
    "griffe>=1.5",
    "mkdocs-include-markdown-plugin>=7",
    "mkdocs-section-index>=0.3",
    "mkdocs-git-revision-date-localized-plugin>=1.2",
    "pymdown-extensions>=10.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocx_sdk"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "ANN", # flake8-annotations (public-API annotations)
    "RUF", # ruff-specific
]
ignore = ["ANN401"] # allow Any in narrow cases

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"] # tests don't need full annotations

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.coverage.run]
branch = true
source = ["ocx_sdk"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(typing\\.)?overload",
    "class .*\\bProtocol\\):",
    "(typing\\.)?assert_never",
    ": \\.{3}",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.html]
directory = "htmlcov"
